# ============================================================================
# Pilot — TV series manager
# https://beaconstack.io/pilot
#
#   1. Set the two host paths below.
#   2. docker compose -f docker/docker-compose.yml up -d
#   3. Open http://<this-host>:8383 (no login needed on your own network).
#
# Pilot runs on its own: add indexers and a download client in its
# Settings, like Sonarr. To run it with Haul, Prism and Pulse, see
# https://beaconstack.io for examples that connect them.
# ============================================================================

services:
  pilot:
    image: ghcr.io/beacon-stack/pilot:latest
    container_name: pilot
    restart: unless-stopped
    ports:
      - "8383:8383"
    environment:
      TZ: UTC                       # your timezone, e.g. America/New_York

      # ── Optional: connect to Pulse ──────────────────────────────────────
      # Pulse hands Pilot its indexers, download clients and quality
      # profiles. To turn it on, set the URL and uncomment the two lines
      # below it. Empty means Pilot runs on its own.
      PILOT_PULSE_URL: ""                         # e.g. http://192.168.1.10:9696
      # PILOT_PULSE_API_KEY: <Pulse's API key>    # Pulse → Settings
      # ADVERTISE_HOST: 192.168.1.10              # this host's address, so
      #                                           # Pulse can reach Pilot
    volumes:
      # Pilot's database and settings. Keep it on a local disk.
      - /path/to/config/pilot:/config

      # Your media and downloads, in ONE folder. Pilot's library is
      # /data/media/tv (created on first start); point your download
      # client at /data/torrents. Give every app the same folder at /data
      # so imports are instant hardlinks and no path mappings are needed.
      # The folder must be writable by uid 1000.
      - /path/to/data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8383/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

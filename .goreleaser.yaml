# GoReleaser config for Pilot
# https://goreleaser.com
#
# Triggered from .github/workflows/release.yml on `v*` tag pushes.
# Builds cross-platform binaries, archives them and publishes a GitHub
# Release. Images are built by the docker job in release.yml, from the
# same Dockerfile CI uses: GoReleaser's own image step builds from a
# folder holding only the binary, which the from-source Dockerfile
# can't use (why the v0.2.0 and v0.3.0 Pulse releases failed).

version: 2

project_name: pilot

before:
  hooks:
    - go mod download
    - sh -c "cd web/ui && npm ci && npm run build"

builds:
  - id: pilot
    main: ./cmd/pilot
    binary: pilot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/beacon-stack/pilot/internal/version.Version={{.Version}}
      - -X github.com/beacon-stack/pilot/internal/version.BuildTime={{.Date}}
      # TMDB/Trakt keys, XOR-obfuscated by tools/obfuscate in release.yml
      # (the same as the Dockerfile does): there are no plain-text
      # variables for them to land in.
      - '{{ .Env.PROVIDER_LDFLAGS }}'

archives:
  - id: pilot
    ids: [pilot]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - '^ci:'
      - '(?i)merge pull request'


release:
  github:
    owner: beacon-stack
    name: pilot
  draft: false
  prerelease: auto
  name_template: 'v{{ .Version }}'

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write  # required to push to ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (race detector, coverage)
        run: go test -race -coverprofile=coverage.out -timeout 180s ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run

      - name: No unreachable code
        run: make deadcode/go

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: No unused files or exports
        run: npm run deadcode

      # Same command the Docker image runs, so a broken frontend build
      # fails the PR instead of the post-merge image push.
      - name: Build
        run: npm run build

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TMDB_LDFLAGS=$(go run ./tools/obfuscate obfuscatedTMDBKey tmdbKeyXORKey "${TMDB_API_KEY}")
          TRAKT_LDFLAGS=$(go run ./tools/obfuscate obfuscatedTraktClientID traktClientIDXORKey "${TRAKT_CLIENT_ID}")
          CGO_ENABLED=0 go build \
            -ldflags "-X github.com/beacon-stack/pilot/internal/version.Version=${VERSION} \
                      -X github.com/beacon-stack/pilot/internal/version.BuildTime=${BUILD_TIME} \
                      ${TMDB_LDFLAGS} \
                      ${TRAKT_LDFLAGS} \
                      -s -w" \
            -o bin/pilot ./cmd/pilot

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pilot-linux-amd64
          path: bin/pilot
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    # Pushes to main publish :main (every merge; the type=ref tag below).
    # :latest is the newest release, published by release.yml on v* tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, test-frontend, build]
    # A normal run takes 4-6 minutes. A stuck one fails here instead of
    # holding a runner for GitHub's 6-hour default.
    timeout-minutes: 30
    # Newest push wins: an older build still running is cancelled, so it
    # can never finish late and push an older image over :main.
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Auto-provided GITHUB_TOKEN; the `packages: write` permission on

          # this job grants the right scopes. Works because the ghcr package

          # already exists (the 403-on-new-package issue only affects the

          # first push).
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push (main)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false

version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - exhaustive
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
  settings:
    staticcheck:
      # v1 ran staticcheck (SA) and gosimple (S1) but not stylecheck (ST)
      # or the quickfix (QF) suggestions, which v2 folds into staticcheck.
      # Keep the same rule set.
      checks:
        - S1*
        - SA*
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G304
        - G115
        # G118 (goroutine started with context.Background) is newer than
        # the v1 linter CI used; revisit separately.
        - G118
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - noctx
        path: _test\.go
      - linters:
          - all
        path: internal/db/generated/
    paths:
      - third_party$
      - builtin$
      - examples$
      - web/ui/node_modules
      - vendor
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pilot/pilot
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

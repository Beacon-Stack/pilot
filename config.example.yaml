# Pilot configuration
# Copy to ~/.config/pilot/config.yaml or /config/config.yaml (Docker).
# All values can also be set via PILOT_* environment variables.

server:
  host: "0.0.0.0"
  port: 8383
  # Extra names Pilot may be opened under without a login from your own
  # network, e.g. behind a reverse proxy. IP addresses, localhost,
  # single-word names and .local/.lan/.home/.internal names always work.
  # Any other name has to log in (this stops a web page from reaching
  # Pilot through your browser). Env: PILOT_SERVER_ALLOWED_HOSTS (commas).
  # allowed_hosts: ["pilot.example.com", "*.example.com"]

database:
  driver: sqlite
  # path: "/path/to/pilot.db"   # default: ~/.config/pilot/pilot.db
  # dsn: ""                        # Postgres only

log:
  level: info    # debug, info, warn, error
  format: json   # json or text

auth:
  # api_key: ""  # auto-generated on first run if empty; for scripts and other apps
  # Who must log in is set in Settings → App Settings → Security and saved
  # in auth.json beside the database. The default is no login: devices on
  # your local network get in, everyone else is refused.
  # Extra address ranges that count as your local network (the private
  # ranges always do). Env: PILOT_AUTH_LOCAL_NETWORKS (comma-separated).
  # local_networks: ["100.64.0.0/10"]

tvdb:
  # api_key: ""  # TheTVDB API key (not yet wired up)

trakt:
  # client_id: ""  # Trakt API key for import lists (trakt.tv/oauth/applications)
